<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Spiky black hair -->
  <path d="M22,15 Q32,4 42,15 Q48,21 42,25 C32,27 32,27 22,25 Q16,21 22,15 Z" fill="#111111"/>
  <!-- Head / Face / Skin -->
  <rect x="24" y="15" width="16" height="14" rx="5" fill="#ffd1a9"/>
  <!-- Eyes -->
  <circle cx="29" cy="21" r="1.5" fill="#111111"/>
  <circle cx="35" cy="21" r="1.5" fill="#111111"/>
  <!-- Smile -->
  <path d="M30,25 Q32,28 34,25" stroke="#c96f53" stroke-width="1.5" fill="none"/>
  
  <!-- Arms (Skin-colored, bent at elbows for action pose) -->
  <!-- Left Arm -->
  <path d="M20,31 Q13,34 15,41" stroke="#ffd1a9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right Arm -->
  <path d="M44,31 Q51,34 49,41" stroke="#ffd1a9" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Red Soccer Jersey (with shoulders) -->
