  <!-- Number 7 (Yellow/Gold) -->
  <path d="M30,34 H34 L32,40" stroke="#ffb703" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- White Shorts -->
  <path d="M23,44 L41,44 L41,49 L33,49 L32,46 L31,49 L23,49 Z" fill="#f1faee"/>
  
  <!-- Legs (Skin + Red Socks + Black Boots) -->
  <!-- Left Leg -->
  <path d="M26,49 L26,59" stroke="#ffd1a9" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Right Leg -->
  <path d="M38,49 L38,59" stroke="#ffd1a9" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Red Socks -->
  <rect x="24" y="52" width="4" height="5" fill="#e63946"/>
  <rect x="36" y="52" width="4" height="5" fill="#e63946"/>
  
  <!-- Black Cleats/Shoes -->
  <path d="M22,59 H27 L28,61 H22 Z" fill="#111111"/>
  <path d="M36,59 H41 L42,61 H36 Z" fill="#111111"/>
